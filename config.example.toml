# Naggy configuration. Copy to config.toml and edit.
# Unknown keys/sections fail loudly at startup, so a typo won't be silently ignored.

[database]
# Path to the SQLite file. In Docker this is under the /data volume.
path = "naggy.db"

[web]
host = "0.0.0.0"
port = 8080
# IANA timezone used for display and for calendar-based (month/year) intervals.
timezone = "UTC"

[notify]
# Web Push notifications. Naggy signs and encrypts these itself — no third-party
# notification service is involved — but it needs a VAPID key to do so:
#
#   naggy vapid-keys
#
# and put the printed NAGGY_VAPID_PRIVATE_KEY in the environment (docker/.env for
# the compose deployment). With no key, push simply stays off and the toggle in
# the UI reports itself unavailable.
#
# Requires HTTPS: browsers won't register a service worker, let alone subscribe to
# push, over plain HTTP.
enabled = false
# Contact address push services can reach you at. "mailto:" or "https:".
subject = "mailto:you@example.com"
# How often the running server checks for newly-due reminders and pushes. Also
# the repost cadence when repeat_while_pending is on. Set to 0 to disable the
# in-process poller and drive `naggy notify` from cron.
poll_seconds = 300
# How long a push service should hold a message for a phone that's offline.
ttl_seconds = 86400

# Local time of day to hold notifications until, "HH:MM", or "" to push the
# moment a chore falls due. Worth setting: a reminder's due time is whatever time
# of day you last marked it done, so without this the nags drift to odd hours.
notify_at = "08:00"
# Never buzz or ring — notifications just appear in the shade.
silent = false
# Re-push an outstanding chore every pass, so swiping the notification away only
# clears it until the next one. Reposts are always silent and never re-alert;
# only the first notification of a cycle gets your attention. This is as close as
# the web gets to Android's non-dismissible "ongoing" notifications.
repeat_while_pending = false
# Show the pending count on the home-screen app icon (Badging API). Unlike a
# notification this genuinely can't be swiped away — it clears when the board does.
badge = true

# Secrets never live in this file. The VAPID signing key comes from
# NAGGY_VAPID_PRIVATE_KEY, and a future Home Assistant token from NAGGY_HA_TOKEN —
# environment only. Putting either here is a startup error.
